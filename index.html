<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Budget Tracker</title>
    <!-- Part 4: Linking HTML and CSS files together -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Part 1: Page Structure -->
    <header>
        <h1>My Budget Tracker</h1>
        <p>Track your income and expenses in one place.</p>
    </header>

    <main>
        <!-- Part 2: The "Add Expense" Section -->
        <section id="add-expense">
            <h2>Add New Expense</h2>
            
            <div class="form-group">
                <span class="field-label">Expense Name:</span>
                <input type="text" placeholder="e.g., Groceries">
            </div>
            
            <div class="form-group">
                <span class="field-label">Amount:</span>
                <input type="number" placeholder="e.g., 50">
            </div>
            
            <div class="form-group">
                <span class="field-label">Category:</span>
                <input type="text" placeholder="e.g., Food">
            </div>
        </section>

        <!-- Part 3: The "Your Expenses" Placeholder Section -->
        <section id="your-expenses">
            <h2>Your Expenses</h2>
            <p class="empty-message">No expenses yet</p>
        </section>
    </main>

</body>
</html>
